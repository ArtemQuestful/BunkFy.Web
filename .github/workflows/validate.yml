name: validate

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: '1/1'
          - os: windows-latest
            shard: '1/2'
          - os: windows-latest
            shard: '2/2'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout web
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        shell: pwsh
        env:
          VITEST_SHARD: ${{ matrix.shard }}
        run: pnpm test --shard $env:VITEST_SHARD

      - name: Build
        run: pnpm build

      - name: Record Windows socket and memory state
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem |
            Select-Object TotalVisibleMemorySize, FreePhysicalMemory |
            ConvertTo-Json -Compress
          Get-NetTCPConnection | Group-Object State, OwningProcess |
            Sort-Object Count -Descending | Select-Object -First 15 Name, Count |
            ConvertTo-Json -Compress
          netsh int ipv4 show dynamicport tcp

  validate:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both operating systems
        shell: pwsh
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if ($env:VERIFY_RESULT -ne 'success') {
            throw 'Web verification failed on at least one operating system.'
          }
